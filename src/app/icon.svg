<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    ИКОНКА ВКЛАДКИ: КРУГЛЫЙ БЕЙДЖ АГЕНТСТВА, ТОТ ЖЕ, ЧТО У НЕГО НА ЯНДЕКС.КАРТАХ
    И В TELEGRAM. Синий диск, белое слово поперёк, слово обведено синим и
    выходит за диск с обеих сторон, ровно как на оригинале (там слово шире
    диска в 1,2 раза, здесь так же). Дуг «рекламное агентство» и точек нет:
    на шестнадцати пикселях они стали бы серым шумом.

    Путь слова это LOGOTYPE_GLYPHS из src/components/chrome/Mark.tsx,
    собранные в один контур; файл статический, импортировать сюда нечего,
    поэтому копия правится вручную вместе с Mark.tsx.

    ТЕМЕ ОКНА ИКОНКА НЕ ПОДСТРАИВАЕТСЯ, и не должна: белое по синему видно и на
    светлой панели вкладок, и на тёмной. Обводка paint-order stroke лежит
    снаружи букв, как на бейдже, поэтому концы слова, вышедшие за диск, не
    тонут в панели.

    Слово поставлено по центру полосы строчных, а не по рамке: на бейдже
    середина диска приходится на середину «e», «G», «o», и высокие «L» и «k»
    выступают над ней вверх.

    Краски числом, потому что файл лежит вне CSS: 10529C это синяя краска
    логотипа (color rubine на листе), FFFFFF белая заливка букв. (Имена токенов
    без ведущих дефисов: две чёрточки подряд внутри комментария делают XML
    невалидным.)
  -->
  <circle cx="64" cy="64" r="51.5" fill="#10529C"/>
