<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    ИКОНКА ВКЛАДКИ. Тот же знак, что и в шапке, теми же путями: буква формой K,
    галочка формой R. Пути скопированы из src/components/chrome/Mark.tsx
    (MARK_K и MARK_R) и обязаны совпадать с ним знак в знак: файл статический,
    импортировать сюда нечего, поэтому копия правится вручную вместе с ним.

    Квадрат, а не 120×100 как прежде: вкладка, закладка и плитка на рабочем
    столе показывают иконку в квадратном поле, и несквадратный файл они
    доводят сами, каждый по-своему.

    ПОЛЕ ПУСТОЕ, ПЛАШКИ НЕТ. Знак вырезан по краске и стоит прямо на том, что
    подложит браузер: на панели вкладок, в закладках, в списке частых сайтов.
    Вместе с плашкой ушли и её скруглённые углы — скруглять стало нечего,
    у краски свой абрис. Плитка на рабочем столе поле себе подставит сама.

    БУКВА МЕНЯЕТ КРАСКУ ПО ТЕМЕ ОКНА. Без плашки одной краски букве не хватает:
    пепел утонул бы в светлой панели, тушь — в тёмной. Поэтому буква печатается
    тушью по умолчанию и пеплом при prefers-color-scheme: dark, тем же ходом,
    которым в шапке ей служит currentColor. Браузер, который запрос не читает,
    получает светлый случай: он и есть панель вкладок по умолчанию. Галочке
    поправка не нужна — рубин виден на обоих полях, как и на бумаге.

    СДВИГ ВПРАВО НА 3,91 ВМЕСТО РОВНОГО ПОЛЯ. Габарит знака (MARK_VIEWBOX,
    0 0 120 90.47) обнимает краску вплотную, но краска внутри него лежит
    неровно: слева стоит тяжёлая буква, а справа рамку держит одно остриё
    галочки, тонкое и почти невесомое. Поставленный по рамке знак ровно
    поэтому и уезжал влево на глаз. Здесь он выставлен по ЦЕНТРУ ТЯЖЕСТИ
    краски: доля закрашенного посчитана по сетке 1024×1024, центр тяжести
    вышел на x=60,09 при середине поля 64, и поле слева стало 13,91 против
    6,1 справа. По рамке знак теперь несимметричен, на глаз — стоит ровно.

    Краски заданы числами намеренно: файл лежит вне CSS и токенов не видит.
    #121110 это ink, #EDEBE6 это chalk, #D12A26 это rubine, те же три краски,
    что в @theme. (Имена токенов здесь без ведущих дефисов: две чёрточки
    подряд внутри комментария делают XML невалидным, и файл перестаёт быть
    картинкой.)
  -->
  <style>
    .letter { fill: #121110 }
    @media (prefers-color-scheme: dark) { .letter { fill: #EDEBE6 } }
  </style>
  <g transform="translate(13.91 23.3) scale(0.9)">
    <path class="letter" fill-rule="evenodd" d="M44.43 0 L65.35 0 L109.78 85.08 L0 85.08 Z M54.89 39.11 L75.26 85.08 L34.52 85.08 Z"/>
    <path fill="#D12A26" d="M118.8 18.32C120.54 19.42,120.23 22.29,118.7 23.48C117.77 24.2,116.66 24.59,115.72 25.26C111.02 28.59,105.97 31.75,101.6 35.51C97.11 39.38,92.41 43.16,88.19 47.33C80.12 55.28,72.83 63.83,66.12 72.95C63.19 76.94,60.61 81.21,58.08 85.46C57.2 86.93,56.44 89.64,54.67 90.17C53.61 90.02,53.19 89.14,52.35 88.55C49.92 86.84,47.88 84.63,45.47 82.88C36.72 76.49,28.21 69.61,19.08 63.71C16.19 61.84,13.43 60.06,10.11 59.06C8.6 58.6,6.12 59.18,4.96 58.25C4.53 56.98,5.61 55.58,6.38 54.62C8.35 52.17,9.66 49.28,11.63 46.85C13.21 44.89,14.11 41.52,16.62 40.42C19.98 38.96,23.86 40.79,26.88 42.25C34.44 45.92,41.15 50.95,48.01 55.76C49.85 57.06,51.49 58.79,53.18 60.29C54.1 61.12,54.97 62.07,56.29 62.04C57.12 61.67,57.42 60.97,58.01 60.3C59.01 59.18,60.08 58.04,61.14 56.97C64.3 53.78,67.85 50.95,71.29 48.07C76.02 44.1,81.33 40.71,86.42 37.25C87.15 36.76,87.69 36.03,88.43 35.53C93.06 32.42,98.01 29.56,102.84 26.78C106.52 24.67,110.28 22.63,113.93 20.48C115.3 19.67,117.15 18.01,118.8 18.32Z"/>
  </g>
</svg>
